<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SIGO - Ingresar JSON
    </title>

    <link
        rel="stylesheet"
        href="css/ingresar_json.css"
    >

</head>


<body>

    <main class="pantalla-json">

        <h1>
            Ingrese el JSON
        </h1>

        <textarea
            id="json-input"
            placeholder="Pegue aquí el JSON extraído del TDR"
        ></textarea>

        <p
            id="mensaje-error"
            class="mensaje-error"
        ></p>

        <button
            id="boton-enviar"
            type="button"
        >
            ENVIAR
        </button>

    </main>


    <script src="js/config.js"></script>
    <script src="js/ingresar_json.js"></script>

</body>

</html>
