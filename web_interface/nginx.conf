server {

    listen 80;

    server_name _; #Cualq


    # --------------------------------------------------------
    # WEB INTERFACE
    # --------------------------------------------------------

    root /usr/share/nginx/html;

    index index.html;


    # --------------------------------------------------------
    # API 
    # --------------------------------------------------------

    location /api/ {

        proxy_pass http://search:5000; #Redirecciona al Modulo Search

    }

}