<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Error - SIGO
    </title>

    <link
        rel="stylesheet"
        href="css/error.css"
    >

</head>


<body>

    <main class="contenedor-error">

        <h1>
            Error de conexión
        </h1>

        <p>
            No fue posible iniciar correctamente SIGO Search.
        </p>

        <pre id="mensaje-error"></pre>

    </main>


    <script>

        const parametros =
            new URLSearchParams(
                window.location.search
            );

        const mensaje =
            parametros.get("mensaje")
            || "No se recibió información adicional.";


        document.getElementById(
            "mensaje-error"
        ).textContent = mensaje;

    </script>

</body>

</html>
